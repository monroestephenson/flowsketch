{{- if .Values.agent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flowsketch.fullname" . }}-agent
  labels:
    {{- include "flowsketch.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  agent.yaml.template: |
    agent:
      nodeName: ${NODE_NAME}
      listen: 0.0.0.0:{{ int64 .Values.agent.listenPort }}
      seed: {{ int64 .Values.agent.seed }}
      flushIntervalMs: {{ int64 .Values.agent.flushIntervalMs }}
      runtimeShards: {{ int64 .Values.agent.runtimeShards }}
      runtimeBatchSize: {{ int64 .Values.agent.runtimeBatchSize }}
      maxSketchMemoryBytes: {{ int64 .Values.agent.maxSketchMemoryBytes }}
      runtimeShardStrategy: {{ .Values.agent.runtimeShardStrategy }}
      {{- if .Values.agent.cpuAffinity.enabled }}
      cpuAffinity:
        captureCpus:
          {{- range .Values.agent.cpuAffinity.captureCpus }}
          - {{ int64 . }}
          {{- end }}
        runtimeCpus:
          {{- range .Values.agent.cpuAffinity.runtimeCpus }}
          - {{ int64 . }}
          {{- end }}
      {{- end }}
      source:
        kind: {{ .Values.agent.source }}
        interface: {{ .Values.agent.interface }}
        {{- if eq .Values.agent.source "ebpf" }}
        objectPath: {{ .Values.agent.ebpf.objectPath }}
        ringBufferBytes: {{ int64 .Values.agent.ebpf.ringBufferBytes }}
        fallbackToAfPacket: {{ .Values.agent.ebpf.fallbackToAfPacket }}
        {{- else }}
        ringBlockSizeBytes: {{ int64 .Values.agent.ringBlockSizeBytes }}
        ringBlockCount: {{ int64 .Values.agent.ringBlockCount }}
        blockRetireTimeoutMs: {{ int64 .Values.agent.blockRetireTimeoutMs }}
        fanoutMode: {{ .Values.agent.fanoutMode }}
        fanoutGroup: {{ int64 .Values.agent.fanoutGroup }}
        {{- end }}
    queries:
      {{- range $name, $_ := .Values.queries }}
      - file: /etc/flowsketch/queries/{{ $name }}
      {{- end }}
    {{- if or (and .Values.gateway.enabled .Values.agent.gatewayPush.enabled) .Values.agent.otlp.enabled }}
    export:
      {{- if and .Values.gateway.enabled .Values.agent.gatewayPush.enabled }}
      gateway:
        endpoint: http://{{ include "flowsketch.fullname" . }}-gateway:{{ .Values.gateway.listenPort }}
        intervalMs: {{ int64 .Values.agent.gatewayPush.intervalMs }}
      {{- end }}
      {{- if .Values.agent.otlp.enabled }}
      otlp:
        endpoint: {{ required "agent.otlp.endpoint is required when OTLP is enabled" .Values.agent.otlp.endpoint }}
        intervalMs: {{ int64 .Values.agent.otlp.intervalMs }}
      {{- end }}
    {{- end }}
  start-agent.sh: |
    #!/bin/sh
    set -eu
    sed "s|\${NODE_NAME}|${NODE_NAME}|g" \
      /etc/flowsketch/config/agent.yaml.template > /tmp/flowsketch-agent.yaml
    {{- if eq .Values.agent.source "ebpf" }}
    {{- if .Values.agent.ebpf.fallbackToAfPacket }}
    exec /usr/local/libexec/flowsketch-agent-ebpf-fallback agent --config /tmp/flowsketch-agent.yaml
    {{- else }}
    exec /usr/local/libexec/flowsketch-agent-ebpf agent --config /tmp/flowsketch-agent.yaml
    {{- end }}
    {{- else }}
    exec /usr/local/libexec/flowsketch-agent-afpacket agent --config /tmp/flowsketch-agent.yaml
    {{- end }}
{{- end }}
