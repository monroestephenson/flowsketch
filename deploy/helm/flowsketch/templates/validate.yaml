{{- if and (not .Values.agent.enabled) (not .Values.gateway.enabled) -}}
{{- fail "at least one of agent.enabled or gateway.enabled must be true" -}}
{{- end -}}
{{- if and .Values.agent.enabled .Values.gateway.enabled .Values.agent.gatewayPush.enabled (ne (toString .Values.agent.seed) (toString .Values.gateway.seed)) -}}
{{- fail "agent.seed and gateway.seed must match when gateway push is enabled" -}}
{{- end -}}
{{- if and .Values.agent.enabled (not .Values.serviceAccounts.agent.create) (empty .Values.serviceAccounts.agent.name) -}}
{{- fail "serviceAccounts.agent.name is required when create=false" -}}
{{- end -}}
{{- if and .Values.gateway.enabled (not .Values.serviceAccounts.gateway.create) (empty .Values.serviceAccounts.gateway.name) -}}
{{- fail "serviceAccounts.gateway.name is required when create=false" -}}
{{- end -}}
{{- $fanoutEnabled := and (eq .Values.agent.source "af_packet") (ne .Values.agent.fanoutMode "single") -}}
{{- $captureLanes := 1 -}}
{{- if $fanoutEnabled -}}
{{- $captureLanes = int .Values.agent.runtimeShards -}}
{{- end -}}
{{- if and .Values.agent.enabled (eq .Values.agent.source "af_packet") (gt (mul (mul .Values.agent.ringBlockSizeBytes .Values.agent.ringBlockCount) $captureLanes) 1073741824) -}}
{{- fail "aggregate agent AF_PACKET receive rings must not exceed 1 GiB" -}}
{{- end -}}
{{- if and (ne .Values.agent.source "ebpf") .Values.agent.ebpf.fallbackToAfPacket -}}
{{- fail "agent.ebpf.fallbackToAfPacket is only valid when agent.source=ebpf" -}}
{{- end -}}
{{- if and (ne .Values.agent.source "af_packet") (ne .Values.agent.fanoutMode "single") -}}
{{- fail "agent.fanoutMode is only valid when agent.source=af_packet" -}}
{{- end -}}
{{- if and $fanoutEnabled (lt (int .Values.agent.runtimeShards) 2) -}}
{{- fail "agent.fanoutMode requires at least two runtime shards" -}}
{{- end -}}
{{- if and $fanoutEnabled (ne .Values.agent.runtimeShardStrategy "flow") -}}
{{- fail "agent.fanoutMode requires agent.runtimeShardStrategy=flow" -}}
{{- end -}}
{{- if and .Values.agent.cpuAffinity.enabled (ne (len .Values.agent.cpuAffinity.captureCpus) $captureLanes) -}}
{{- fail "agent.cpuAffinity.captureCpus must contain exactly one CPU for each capture lane" -}}
{{- end -}}
{{- if and .Values.agent.cpuAffinity.enabled (ne (len .Values.agent.cpuAffinity.runtimeCpus) (int .Values.agent.runtimeShards)) -}}
{{- fail "agent.cpuAffinity.runtimeCpus must contain exactly one CPU for each runtime shard" -}}
{{- end -}}
