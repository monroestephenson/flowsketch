{{- if .Values.monitoring.enabled }}
{{- if .Values.agent.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "flowsketch.fullname" . }}-agent
  labels:
    {{- include "flowsketch.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "flowsketch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
      relabelings:
        - targetLabel: flowsketch_release
          replacement: {{ .Release.Name | quote }}
{{- end }}
{{- if and .Values.agent.enabled .Values.gateway.enabled }}
---
{{- end }}
{{- if .Values.gateway.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "flowsketch.fullname" . }}-gateway
  labels:
    {{- include "flowsketch.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "flowsketch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
      relabelings:
        - targetLabel: flowsketch_release
          replacement: {{ .Release.Name | quote }}
{{- end }}
{{- if .Values.monitoring.rules.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "flowsketch.fullname" . }}
  labels:
    {{- include "flowsketch.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: flowsketch-agent
      rules:
        - alert: FlowSketchPacketDrops
          expr: sum(rate(flowsketch_agent_kernel_dropped_packets_total{flowsketch_release="{{ .Release.Name }}"}[5m])) + sum(rate(flowsketch_agent_ebpf_ring_dropped_events_total{flowsketch_release="{{ .Release.Name }}"}[5m])) + sum(rate(flowsketch_agent_dropped_events_total{flowsketch_release="{{ .Release.Name }}"}[5m])) + sum(rate(flowsketch_agent_kernel_queue_freezes_total{flowsketch_release="{{ .Release.Name }}"}[5m])) > 0
          for: 2m
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch is dropping observed traffic
            description: AF_PACKET/eBPF ring drops, userspace drops, or receive-ring freezes have remained nonzero for two minutes.
        - alert: FlowSketchEbpfParseErrors
          expr: increase(flowsketch_agent_ebpf_parse_errors_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch eBPF parser rejected malformed traffic
            description: The tc collector observed malformed or truncated packet headers.
        - alert: FlowSketchEbpfFallback
          expr: increase(flowsketch_agent_ebpf_fallbacks_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch fell back from eBPF to AF_PACKET
            description: An explicitly enabled fallback occurred after an eBPF load, verifier, attach, or receive failure.
        - alert: FlowSketchAgentNotReady
          expr: flowsketch_agent_ready{flowsketch_release="{{ .Release.Name }}"} == 0
          for: 5m
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch agent is not ready
            description: A FlowSketch agent has not been ready for five minutes.
        - alert: FlowSketchLateEvents
          expr: increase(flowsketch_agent_late_events_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch rejected late events
            description: Events arrived before the earliest open runtime window.
        - alert: FlowSketchInvalidTimestamps
          expr: increase(flowsketch_agent_invalid_timestamps_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch quarantined invalid live timestamps
            description: AF_PACKET or normalized eBPF timestamps fell outside the five-minute realtime trust window.
        - alert: FlowSketchOtlpExportFailures
          expr: increase(flowsketch_agent_otlp_export_failures_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch OTLP exports are failing
            description: At least one agent failed to export metrics to its configured local OpenTelemetry Collector.
        - alert: FlowSketchAgentSketchMemoryHigh
          expr: flowsketch_agent_sketch_memory_bytes{flowsketch_release="{{ .Release.Name }}"} / flowsketch_agent_sketch_memory_capacity_bytes{flowsketch_release="{{ .Release.Name }}"} >= 0.9
          for: 5m
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch agent sketch memory is near its configured ceiling
            description: Actual sketch-owned memory has remained above 90 percent of agent.maxSketchMemoryBytes for five minutes.
    - name: flowsketch-gateway
      rules:
        - alert: FlowSketchGatewayPushFailures
          expr: increase(flowsketch_agent_gateway_push_failures_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway snapshot pushes are failing
            description: At least one agent failed to push snapshots during the last ten minutes.
        - alert: FlowSketchGatewayRejectedSnapshots
          expr: increase(flowsketch_gateway_snapshots_rejected_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway rejected snapshots
            description: The gateway received incompatible or malformed sketch snapshots.
        - alert: FlowSketchGatewayNodeAdmissionRejected
          expr: increase(flowsketch_gateway_node_admission_rejections_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway node capacity is exhausted
            description: At least one new node identity was rejected; raise maxNodes only after validating the gateway memory budget.
        - alert: FlowSketchGatewaySketchBudgetRejected
          expr: increase(flowsketch_gateway_sketch_budget_rejections_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway retained-state budget is exhausted
            description: At least one valid per-query node state was rejected before retention would exceed maxRetainedSketchBytes.
        - alert: FlowSketchGatewayBodyBudgetExhausted
          expr: increase(flowsketch_gateway_body_budget_rejections_total{flowsketch_release="{{ .Release.Name }}"}[10m]) > 0
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway snapshot body budget is exhausted
            description: Concurrent snapshot uploads exceeded the bounded in-flight body budget.
        - alert: FlowSketchGatewayNodeCapacityHigh
          expr: flowsketch_gateway_nodes_tracked{flowsketch_release="{{ .Release.Name }}"} / flowsketch_gateway_nodes_capacity{flowsketch_release="{{ .Release.Name }}"} >= 0.9
          for: 5m
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway node capacity is nearly full
            description: The gateway has retained at least 90 percent of its configured live-node identities for five minutes.
        - alert: FlowSketchGatewaySketchMemoryHigh
          expr: flowsketch_gateway_retained_sketch_bytes{flowsketch_release="{{ .Release.Name }}"} / flowsketch_gateway_retained_sketch_capacity_bytes{flowsketch_release="{{ .Release.Name }}"} >= 0.9
          for: 5m
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway retained sketch memory is nearly full
            description: Per-node retained sketch state has remained above 90 percent of its hard byte budget for five minutes.
        - alert: FlowSketchGatewayMergeGap
          expr: flowsketch_gateway_nodes_known{flowsketch_release="{{ .Release.Name }}"} - flowsketch_gateway_nodes_merged{flowsketch_release="{{ .Release.Name }}"} > 0
          for: 5m
          labels: {severity: {{ .Values.monitoring.rules.severity }}}
          annotations:
            summary: FlowSketch gateway cannot merge every known node
            description: Known agents have remained on different newest window boundaries for five minutes.
{{- end }}
{{- end }}
