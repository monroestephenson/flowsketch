# Install as /etc/systemd/system/flowsketch-agent.service.d/ebpf.conf when
# source.kind is ebpf. The base unit intentionally grants CAP_NET_RAW for its
# default AF_PACKET configuration; these empty assignments reset that policy.
[Service]
AmbientCapabilities=
AmbientCapabilities=CAP_BPF CAP_NET_ADMIN CAP_PERFMON
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_BPF CAP_NET_ADMIN CAP_PERFMON
