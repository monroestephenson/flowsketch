apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowsketch-gateway-ingress
  namespace: flowsketch
  labels:
    app.kubernetes.io/name: flowsketch
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flowsketch
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flowsketch
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: 9465
