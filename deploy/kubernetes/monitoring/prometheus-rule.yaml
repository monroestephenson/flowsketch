apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flowsketch
  labels:
    app.kubernetes.io/name: flowsketch
spec:
  groups:
    - name: flowsketch-agent
      rules:
        - alert: FlowSketchPacketDrops
          expr: >-
            sum(rate(flowsketch_agent_kernel_dropped_packets_total[5m]))
            + sum(rate(flowsketch_agent_ebpf_ring_dropped_events_total[5m]))
            + sum(rate(flowsketch_agent_dropped_events_total[5m]))
            + sum(rate(flowsketch_agent_kernel_queue_freezes_total[5m])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: FlowSketch is dropping observed traffic
            description: AF_PACKET/eBPF ring drops, userspace drops, or receive-ring freezes have remained nonzero for two minutes.
        - alert: FlowSketchEbpfParseErrors
          expr: increase(flowsketch_agent_ebpf_parse_errors_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch eBPF parser rejected malformed traffic
            description: The tc collector observed malformed or truncated packet headers.
        - alert: FlowSketchEbpfFallback
          expr: increase(flowsketch_agent_ebpf_fallbacks_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch fell back from eBPF to AF_PACKET
            description: An explicitly enabled fallback occurred after an eBPF load, verifier, attach, or receive failure.
        - alert: FlowSketchAgentNotReady
          expr: flowsketch_agent_ready == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowSketch agent is not ready
            description: A FlowSketch agent has not been ready for five minutes.
        - alert: FlowSketchLateEvents
          expr: increase(flowsketch_agent_late_events_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch rejected late events
            description: Events arrived before the earliest open runtime window.
        - alert: FlowSketchInvalidTimestamps
          expr: increase(flowsketch_agent_invalid_timestamps_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch quarantined invalid live timestamps
            description: AF_PACKET or normalized eBPF timestamps fell outside the five-minute realtime trust window.
        - alert: FlowSketchOtlpExportFailures
          expr: increase(flowsketch_agent_otlp_export_failures_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch OTLP exports are failing
            description: At least one agent failed to export metrics to its configured local OpenTelemetry Collector.
    - name: flowsketch-gateway
      rules:
        - alert: FlowSketchGatewayPushFailures
          expr: increase(flowsketch_agent_gateway_push_failures_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch gateway snapshot pushes are failing
            description: At least one agent failed to push snapshots during the last ten minutes.
        - alert: FlowSketchGatewayRejectedSnapshots
          expr: increase(flowsketch_gateway_snapshots_rejected_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch gateway rejected snapshots
            description: The gateway received incompatible or malformed sketch snapshots.
        - alert: FlowSketchGatewayNodeAdmissionRejected
          expr: increase(flowsketch_gateway_node_admission_rejections_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch gateway node capacity is exhausted
            description: At least one new node identity was rejected; raise maxNodes only after validating the gateway memory budget.
        - alert: FlowSketchGatewayBodyBudgetExhausted
          expr: increase(flowsketch_gateway_body_budget_rejections_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: FlowSketch gateway snapshot body budget is exhausted
            description: Concurrent snapshot uploads exceeded the bounded in-flight body budget.
        - alert: FlowSketchGatewayNodeCapacityHigh
          expr: flowsketch_gateway_nodes_tracked / flowsketch_gateway_nodes_capacity >= 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowSketch gateway node capacity is nearly full
            description: The gateway has retained at least 90 percent of its configured live-node identities for five minutes.
        - alert: FlowSketchGatewayMergeGap
          expr: flowsketch_gateway_nodes_known - flowsketch_gateway_nodes_merged > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowSketch gateway cannot merge every known node
            description: Known agents have remained on different newest window boundaries for five minutes.
