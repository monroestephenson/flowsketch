apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flowsketch-agent
  labels:
    app.kubernetes.io/name: flowsketch
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flowsketch
      app.kubernetes.io/component: agent
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
