[workspace]
resolver = "2"
members = [
    "crates/flowsketch-core",
    "crates/flowsketch-algos",
    "crates/flowsketch-ir",
    "crates/flowsketch-planner",
    "crates/flowsketch-runtime",
    "crates/flowsketch-pcap",
    "crates/flowsketch-prometheus",
    "crates/flowsketch-otel",
    "crates/flowsketch-agent",
    "crates/flowsketch-ebpf",
    "crates/flowsketch-gateway",
    "crates/flowsketch-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/monroestephenson/flowsketch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
rayon = "1"

flowsketch-core = { path = "crates/flowsketch-core", version = "0.1.0" }
flowsketch-algos = { path = "crates/flowsketch-algos", version = "0.1.0" }
flowsketch-ir = { path = "crates/flowsketch-ir", version = "0.1.0" }
flowsketch-planner = { path = "crates/flowsketch-planner", version = "0.1.0" }
flowsketch-runtime = { path = "crates/flowsketch-runtime", version = "0.1.0" }
flowsketch-pcap = { path = "crates/flowsketch-pcap", version = "0.1.0" }
flowsketch-prometheus = { path = "crates/flowsketch-prometheus", version = "0.1.0" }
flowsketch-otel = { path = "crates/flowsketch-otel", version = "0.1.0" }
flowsketch-agent = { path = "crates/flowsketch-agent", version = "0.1.0" }
flowsketch-gateway = { path = "crates/flowsketch-gateway", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
