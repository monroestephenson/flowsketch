# FlowSketch live agent configuration.
#
# Demo mode (no privileges needed): replay a pcap and serve results.
#   flowsketch synth --out demo.pcap --packets 200000
#   flowsketch agent --config examples/agent.yaml
#   curl localhost:9464/metrics
#
# Live mode: switch source.kind to af_packet (requires CAP_NET_RAW/root):
#   source:
#     kind: af_packet
#     interface: eth0
#     ringBlockSizeBytes: 1048576
#     ringBlockCount: 64
#     blockRetireTimeoutMs: 64
#     fanoutMode: single      # single | hash | rx_queue
#     fanoutGroup: 0          # zero asks Linux for a netns-unique group
#   For tc eBPF instead:
#     kind: ebpf
#     interface: eth0
#     objectPath: ../target/bpf/flowsketch_tc.bpf.o
#     ringBufferBytes: 16777216
#     fallbackToAfPacket: false
agent:
  nodeName: node-a
  listen: 127.0.0.1:9464
  seed: 0
  flushIntervalMs: 1000
  # Scale after measuring per-shard memory and CPU on the target node.
  runtimeShards: 1
  runtimeBatchSize: 4096
  runtimeShardStrategy: flow
  # Linux high-rate deployments can pin each capture lane and runtime worker.
  # The capture list contains one CPU normally, or one per runtime shard when
  # AF_PACKET fanoutMode is hash/rx_queue.
  # cpuAffinity:
  #   captureCpus: [0]
  #   runtimeCpus: [1]
  source:
    kind: pcap
    path: ../demo.pcap
queries:
  - file: queries/top-talkers.yaml
  - file: queries/suspected-scanners.yaml
  - file: queries/flow-size-quantiles.yaml
# Optional exports:
# - otlp: push estimates to an OpenTelemetry Collector / Grafana Alloy /
#   Datadog OTel pipeline over OTLP/HTTP+JSON (plain http; deploy the
#   collector as a local sidecar/daemonset)
# - gateway: push sketch snapshots to a flowsketch gateway for
#   cluster-level merge (see examples/gateway.yaml; the gateway must run
#   the same query files and seed)
# export:
#   otlp:
#     endpoint: http://otel-collector:4318
#     intervalMs: 5000
#   gateway:
#     endpoint: http://flowsketch-gateway:9465
#     intervalMs: 5000
