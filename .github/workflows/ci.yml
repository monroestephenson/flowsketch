name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  minimum-rust:
    name: Rust 1.85 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimum-rust
      - name: Test locked workspace on minimum Rust
        run: cargo test --locked --workspace

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build release CLI
        run: cargo build --locked --release -p flowsketch-cli
      - name: End-to-end smoke (synth -> validate -> explain -> replay)
        run: |
          BIN=target/release/flowsketch
          $BIN synth --out /tmp/ci.pcap --packets 50000 --scanners 2 --heavy-talkers 3
          $BIN validate examples/queries/*.yaml
          $BIN explain examples/queries/suspected-scanners.yaml
          $BIN replay /tmp/ci.pcap \
            --query examples/queries/top-talkers.yaml \
            --query examples/queries/suspected-scanners.yaml \
            --format prometheus | head -20
          $BIN bench --trace /tmp/ci.pcap \
            --query examples/queries/top-talkers.yaml \
            --profile all
      - name: Agent smoke (pcap source -> HTTP endpoints)
        run: |
          BIN=target/release/flowsketch
          cat > /tmp/agent-ci.yaml <<EOF
          agent:
            listen: 127.0.0.1:19464
            flushIntervalMs: 100
            source:
              kind: pcap
              path: /tmp/ci.pcap
          queries:
            - file: $PWD/examples/queries/top-talkers.yaml
            - file: $PWD/examples/queries/flow-size-quantiles.yaml
            - file: $PWD/examples/queries/source-entropy.yaml
          EOF
          $BIN agent --config /tmp/agent-ci.yaml &
          AGENT_PID=$!
          for _ in $(seq 1 50); do
            if curl -sf localhost:19464/readyz; then
              break
            fi
            sleep 0.2
          done
          sleep 2
          curl -sf localhost:19464/healthz
          curl -sf localhost:19464/metrics | grep -E "flowsketch_(estimate|agent_events_processed_total)" | head -10
          curl -sf localhost:19464/v1/queries | grep '"algorithm"'
          kill $AGENT_PID
      - name: Distributed merge smoke (two replays -> merge-snapshots)
        run: |
          BIN=target/release/flowsketch
          $BIN synth --out /tmp/ci-b.pcap --packets 30000 --scanners 1 --seed 8
          $BIN replay /tmp/ci.pcap --query examples/queries/suspected-scanners.yaml \
            --seed 9 --snapshot-out /tmp/snaps-a > /dev/null
          $BIN replay /tmp/ci-b.pcap --query examples/queries/suspected-scanners.yaml \
            --seed 9 --snapshot-out /tmp/snaps-b > /dev/null
          $BIN merge-snapshots /tmp/snaps-a/*.fsk1 /tmp/snaps-b/*.fsk1
      - name: Gateway restart and compatibility recovery smoke
        run: scripts/gateway-restart-smoke.sh target/release/flowsketch

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build locked production image
        run: docker build --tag flowsketch:ci .
      - name: Verify non-root image and executable
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' flowsketch:ci)" = "65532:65532"
          docker run --rm --read-only flowsketch:ci --help >/dev/null
          docker run --rm --read-only --entrypoint test flowsketch:ci \
            -r /usr/lib/flowsketch/flowsketch_tc.bpf.o
          docker run --rm --read-only \
            --volume "$PWD/examples/queries:/queries:ro" \
            flowsketch:ci validate /queries/top-talkers.yaml

  deployment:
    name: Kubernetes and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2
      - name: Validate deployment renders and safety constraints
        run: scripts/validate-deploy.sh
