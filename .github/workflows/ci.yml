name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release CLI
        run: cargo build --release -p flowsketch-cli
      - name: End-to-end smoke (synth -> validate -> explain -> replay)
        run: |
          BIN=target/release/flowsketch
          $BIN synth --out /tmp/ci.pcap --packets 50000 --scanners 2 --heavy-talkers 3
          $BIN validate examples/queries/*.yaml
          $BIN explain examples/queries/suspected-scanners.yaml
          $BIN replay /tmp/ci.pcap \
            --query examples/queries/top-talkers.yaml \
            --query examples/queries/suspected-scanners.yaml \
            --format prometheus | head -20
          $BIN bench --trace /tmp/ci.pcap \
            --query examples/queries/top-talkers.yaml \
            --profile all
      - name: Agent smoke (pcap source -> HTTP endpoints)
        run: |
          BIN=target/release/flowsketch
          cat > /tmp/agent-ci.yaml <<EOF
          agent:
            listen: 127.0.0.1:19464
            flushIntervalMs: 100
            source:
              kind: pcap
              path: /tmp/ci.pcap
          queries:
            - file: $PWD/examples/queries/top-talkers.yaml
            - file: $PWD/examples/queries/flow-size-quantiles.yaml
            - file: $PWD/examples/queries/source-entropy.yaml
          EOF
          $BIN agent --config /tmp/agent-ci.yaml &
          AGENT_PID=$!
          for i in $(seq 1 50); do
            curl -sf localhost:19464/readyz && break || sleep 0.2
          done
          sleep 2
          curl -sf localhost:19464/healthz
          curl -sf localhost:19464/metrics | grep -E "flowsketch_(estimate|agent_events_processed_total)" | head -10
          curl -sf localhost:19464/v1/queries | grep '"algorithm"'
          kill $AGENT_PID
      - name: Distributed merge smoke (two replays -> merge-snapshots)
        run: |
          BIN=target/release/flowsketch
          $BIN synth --out /tmp/ci-b.pcap --packets 30000 --scanners 1 --seed 8
          $BIN replay /tmp/ci.pcap --query examples/queries/suspected-scanners.yaml \
            --seed 9 --snapshot-out /tmp/snaps-a > /dev/null
          $BIN replay /tmp/ci-b.pcap --query examples/queries/suspected-scanners.yaml \
            --seed 9 --snapshot-out /tmp/snaps-b > /dev/null
          $BIN merge-snapshots /tmp/snaps-a/*.fsk1 /tmp/snaps-b/*.fsk1
      - name: Gateway smoke (two agents push -> merged cluster /metrics)
        run: |
          BIN=target/release/flowsketch
          cat > /tmp/gateway-ci.yaml <<EOF
          gateway:
            listen: 127.0.0.1:19465
          queries:
            - file: $PWD/examples/queries/suspected-scanners.yaml
          EOF
          $BIN gateway --config /tmp/gateway-ci.yaml &
          GATEWAY_PID=$!
          for node in a b; do
            cat > /tmp/agent-gw-$node.yaml <<EOF
          agent:
            nodeName: node-$node
            listen: 127.0.0.1:0
            flushIntervalMs: 100
            source:
              kind: pcap
              path: /tmp/ci-$node.pcap
          queries:
            - file: $PWD/examples/queries/suspected-scanners.yaml
          export:
            gateway:
              endpoint: http://127.0.0.1:19465
              intervalMs: 200
          EOF
          done
          cp /tmp/ci.pcap /tmp/ci-a.pcap
          $BIN agent --config /tmp/agent-gw-a.yaml &
          AGENT_A=$!
          $BIN agent --config /tmp/agent-gw-b.yaml &
          AGENT_B=$!
          for i in $(seq 1 100); do
            curl -sf localhost:19465/metrics | grep -q 'flowsketch_gateway_nodes_merged{query="suspected_scanners"} 2' && break
            sleep 0.2
          done
          curl -sf localhost:19465/metrics | grep -E "flowsketch_(estimate|gateway_nodes_merged|gateway_pushes_total)" | head -10
          curl -sf localhost:19465/metrics | grep -q 'flowsketch_gateway_nodes_merged{query="suspected_scanners"} 2'
          curl -sf localhost:19465/v1/nodes | grep '"node-a"'
          kill $AGENT_A $AGENT_B $GATEWAY_PID

  deployment:
    name: Kubernetes and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2
      - name: Validate deployment renders and safety constraints
        run: scripts/validate-deploy.sh
